<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="نقطة ديزاينز — احصل على هديتك الخاصة" />
  <title>هدية نقطة ديزاينز</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500&family=Inter:wght@300;400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ─── HERO ───────────────────────────────────────────────── -->
  <main>
    <section class="hero" aria-labelledby="hero-heading">

      <div class="hero-glow" aria-hidden="true"></div>

      <div class="hero-content">

        <img
          src="assets/profile.jpg"
          alt="نقطة ديزاينز"
          class="hero-logo-img"
        />

        <h1 class="hero-heading" id="hero-heading">
          مبسوطين انك دورت علينا ووقفت علشان تعمل scan
        </h1>

        <button
          class="btn-cta"
          id="js-open"
          aria-haspopup="dialog"
          aria-controls="gift-modal"
        >
          دوس هنا وخد هديتك
        </button>

      </div>

    </section>
  </main>

  <!-- ─── GIFT MODAL ─────────────────────────────────────────── -->
  <div
    class="modal-overlay"
    id="gift-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-hidden="true"
  >
    <div class="modal-card" id="modal-card">

      <button
        class="modal-close"
        id="js-close"
        aria-label="إغلاق النافذة"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M1 1L13 13M13 1L1 13"
                stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
      </button>

      <div class="modal-image-wrap">
        <img
          src="assets/qr2.jpg.jpeg"
          alt="كوبون خصم نقطة ديزاينز"
          class="modal-img"
          loading="lazy"
        />
      </div>

      <a
        href="https://ig.me/m/noqtadesigns"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-instagram"
        id="modal-title"
        aria-label="افتح محادثة انستجرام مع نقطة ديزاينز في تاب جديد"
        data-ig-message="هاي! أنا عندي الكوبون بتاعكم، هبعتلكم السكرين شوت هنا 🎟️"
      >
        <svg class="ig-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="6"
                stroke="currentColor" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="4.5"
                  stroke="currentColor" stroke-width="1.5"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
        Send us a screenshot here
      </a>

      <div class="copy-toast" id="copy-toast" aria-live="polite" aria-atomic="true"></div>

      <p class="modal-instructions">
        Take a screenshot of the coupon and send it to us on Instagram
      </p>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
