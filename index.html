<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="نقطة ديزاينز — احصل على هديتك الخاصة" />
  <title>هدية نقطة ديزاينز</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500&family=Inter:wght@300;400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- confetti canvas injected by JS -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- ─── NAVIGATION ─────────────────────────────────────────── -->
  <header role="banner">
    <nav class="nav" aria-label="التنقل الرئيسي">
      <a href="/" class="nav-logo" aria-label="نقطة ديزاينز — الصفحة الرئيسية">
        <img
          src="assets/logo.jpg"
          alt="نقطة ديزاينز"
          class="logo-img"
          width="48"
          height="48"
        />
      </a>
    </nav>
  </header>

  <!-- ─── HERO ───────────────────────────────────────────────── -->
  <main>
    <section class="hero" aria-labelledby="hero-heading">

      <div class="hero-content">
        <span class="eyebrow">هدية حصرية</span>

        <h1 class="hero-heading" id="hero-heading">
          هدية بتستحقها
        </h1>

        <p class="hero-sub">
          تصميمات نقطة بتكافئك بخصم خاص.<br />
          اضغط واستلم هديتك دلوقتي.
        </p>

        <button
          class="btn-cta"
          id="js-open"
          aria-haspopup="dialog"
          aria-controls="gift-modal"
        >
          احصل على هديتك
        </button>
      </div>

    </section>
  </main>

  <!-- ─── GIFT MODAL ─────────────────────────────────────────── -->
  <div
    class="modal-overlay"
    id="gift-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-hidden="true"
  >
    <div class="modal-card" id="modal-card">

      <button
        class="modal-close"
        id="js-close"
        aria-label="إغلاق النافذة"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M1 1L13 13M13 1L1 13"
                stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
      </button>

      <span class="modal-eyebrow">هديتك جاهزة 🎁</span>

      <div class="modal-image-wrap">
        <img
          src="assets/qr2.jpg.jpeg"
          alt="بطاقة هدية نقطة ديزاينز — كود خصم خاص"
          class="modal-img"
          loading="lazy"
        />
      </div>

      <h2 class="modal-heading" id="modal-title">خصم خاص ليك</h2>

      <p class="modal-instructions">
        خد سكرين شوت للصورة دي وابعتها على الانستجرام عشان تستلم خصمك.
      </p>

      <a
        href="https://www.instagram.com/noqtadesigns/?hl=ar"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-instagram"
        aria-label="افتح صفحة نقطة ديزاينز على انستجرام في تاب جديد"
      >
        <svg class="ig-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="6"
                stroke="currentColor" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="4.5"
                  stroke="currentColor" stroke-width="1.5"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
        افتح انستجرام نقطة
      </a>

    </div>
  </div>

  <!-- ─── FOOTER ─────────────────────────────────────────────── -->
  <footer class="footer" role="contentinfo">
    <span class="footer-copy">© نقطة ديزاينز 2026</span>
    <a
      href="https://www.instagram.com/noqtadesigns/?hl=ar"
      target="_blank"
      rel="noopener noreferrer"
      class="footer-ig"
      aria-label="انستجرام نقطة ديزاينز"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="6"
              stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="4.5"
                stroke="currentColor" stroke-width="1.5"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
      </svg>
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
